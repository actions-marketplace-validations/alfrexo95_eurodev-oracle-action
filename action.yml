name: 'EuroDev Oracle Action'
description: 'Automated GDPR checks, EU tech facts, and advanced lead generation.'
author: 'alfrexo95'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  github-token:
    description: 'GitHub token.'
    required: true
  etherscan-api-key:
    description: 'Etherscan API key.'
    required: true
  crypto-address-eth:
    description: 'ETH address for payments.'
    required: true
  pat-token:
    description: 'PAT for global search.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: pip install requests
    - name: Run EuroDev Oracle
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ETHERSCAN_API_KEY: ${{ inputs.etherscan-api-key }}
        CRYPTO_ADDRESS_ETH: ${{ inputs.crypto-address-eth }}
        PAT_TOKEN: ${{ inputs.pat-token }}
      run: python ${{ github.action_path }}/eurodev.py
